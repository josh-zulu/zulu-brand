# Runs on every push to main (and on any pull request): the deck must typecheck and build.
name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w ai-trends
        env:
          DECK_BASE: /${{ github.event.repository.name }}/
